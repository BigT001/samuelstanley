name: Founder's Insight AI Content Agent

on:
  schedule:
    # Publishes Founder's Insight strategic breakdowns daily at: 8AM & 4PM (UTC)
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI
    inputs:
      url:
        description: 'Optional article/YouTube URL to convert to Founder\'s Insight strategic breakdown'
        required: false
        type: string

jobs:
  run-insight-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required so the action can commit content/insight/*.md back

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Founder's Insight AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AGENT_CLI: 'true'
        run: |
          URL="${{ github.event.inputs.url }}"
          if [ -n "$URL" ]; then
            npx tsx scripts/insight-agent.ts "$URL"
          else
            npx tsx scripts/insight-agent.ts
          fi

      - name: Commit and Push Founder's Insight Post
        run: |
          git config --global user.name  "Founders Insight AI Agent"
          git config --global user.email "insight@samuelstanley.com"
          git add content/insight/
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "feat(insight): auto-generated founder's insight post $(date +'%Y-%m-%d %H:%M UTC')" \
            && git push
